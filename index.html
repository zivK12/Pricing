<!DOCTYPE html>
<html lang="he" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>פנקס — הצעות מחיר בשטח</title>
<link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Assistant:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{
  --plaster:#F1EFEA;
  --card:#FFFFFF;
  --ink:#22261F;
  --ink-soft:#6B7064;
  --line:#DDD9CF;
  --amber:#E8A23B;
  --amber-deep:#a56910;
  --green:#3E6B4F;
  --red:#B4462F;
  --radius:14px;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{
  font-family:'Assistant',sans-serif;
  background:var(--plaster);
  color:var(--ink);
  min-height:100vh;
  font-size:17px;
}
h1,h2,h3,.display{font-family:'Rubik',sans-serif}

/* ===== Header ===== */
header{
  background:var(--ink);
  color:#F5F2EA;
  padding:14px 20px 12px;
  position:sticky;top:0;z-index:40;
}
.hd-top{display:flex;justify-content:space-between;align-items:center;gap:12px}
.brand{font-family:'Rubik';font-weight:800;font-size:20px;letter-spacing:.5px}
.brand span{color:var(--amber)}
.proj-line{display:flex;gap:8px;align-items:center;flex-wrap:wrap;margin-top:8px}
.proj-input{
  background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.18);
  color:#F5F2EA;border-radius:9px;padding:7px 12px;font-family:'Assistant';
  font-size:15px;min-width:0;
}
.proj-input::placeholder{color:rgba(245,242,234,.45)}
.proj-input.client{width:170px}
.proj-input.addr{flex:1;min-width:140px}
/* general notes chips */
.chips{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px;align-items:center}
.chip{
  background:rgba(232,162,59,.15);border:1px solid rgba(232,162,59,.5);
  color:#F2CE93;border-radius:999px;padding:4px 12px;font-size:14px;
  display:flex;align-items:center;gap:6px;
}
.chip button{background:none;border:none;color:#F2CE93;font-size:15px;cursor:pointer;line-height:1}
.chip-add{
  background:none;border:1px dashed rgba(255,255,255,.35);color:rgba(245,242,234,.7);
  border-radius:999px;padding:4px 14px;font-size:14px;cursor:pointer;font-family:'Assistant'
}

/* ===== Tabs ===== */
.tabs{display:flex;background:var(--ink);padding:0 20px;gap:4px;position:sticky;top:0;z-index:39}
.tab{
  flex:1;text-align:center;padding:12px 0 14px;color:rgba(245,242,234,.55);
  font-family:'Rubik';font-weight:600;font-size:16px;border:none;background:none;cursor:pointer;
  border-bottom:3px solid transparent;
}
.tab.active{color:#fff;border-bottom-color:var(--amber)}
.tab .badge{
  background:var(--amber);color:var(--ink);border-radius:999px;
  font-size:12px;padding:1px 8px;margin-inline-start:6px;font-weight:700;
}

main{padding:20px 20px 120px;max-width:900px;margin:0 auto}

/* ===== Menu (library) ===== */
.cat{margin-bottom:14px;border:1px solid var(--line);border-radius:var(--radius);background:var(--card);overflow:hidden}
.cat-head{
  width:100%;display:flex;align-items:center;gap:12px;padding:16px 18px;
  background:none;border:none;cursor:pointer;text-align:right;font-family:'Rubik'
}
.cat-icon{font-size:24px;width:40px;height:40px;display:flex;align-items:center;justify-content:center;background:var(--plaster);border-radius:10px}
.cat-name{font-weight:700;font-size:18px;flex:1;color:var(--ink)}
.cat-count{font-size:13px;color:var(--ink-soft);font-family:'Assistant'}
.cat-arrow{color:var(--ink-soft);transition:transform .2s}
.cat.open .cat-arrow{transform:rotate(90deg)}
.jobs{display:none;padding:0 14px 14px;grid-template-columns:repeat(auto-fill,minmax(200px,1fr));gap:10px}
.cat.open .jobs{display:grid}
.job-tile{
  border:1px solid var(--line);border-radius:11px;padding:14px;background:#FBFAF7;
  cursor:pointer;text-align:right;font-family:'Assistant';transition:border-color .15s, transform .05s;
}
.job-tile:active{transform:scale(.98)}
.job-tile:hover{border-color:var(--amber)}
.job-tile .jt-name{font-weight:700;font-size:16px;margin-bottom:3px}
.job-tile .jt-desc{font-size:13.5px;color:var(--ink-soft);line-height:1.35}
.job-tile .jt-add{margin-top:8px;color:var(--amber-deep);font-weight:700;font-size:14px}

/* ===== Sheet (job config) ===== */
.overlay{
  position:fixed;inset:0;background:rgba(30,32,26,.45);z-index:60;display:none;
}
.overlay.show{display:block}
.sheet{
  position:fixed;bottom:0;left:0;right:0;z-index:61;background:var(--card);
  border-radius:22px 22px 0 0;max-height:86vh;overflow-y:auto;
  transform:translateY(100%);transition:transform .25s ease, visibility .25s;box-shadow:0 -8px 40px rgba(0,0,0,.2);
  max-width:900px;margin:0 auto;visibility:hidden;
}
.sheet.show{transform:translateY(0);visibility:visible}
.sheet-grip{width:44px;height:5px;border-radius:99px;background:var(--line);margin:10px auto 0}
.sheet-body{padding:16px 24px 28px}
.sheet h3{font-size:21px;font-weight:700;margin-bottom:2px}
.sheet .sub{color:var(--ink-soft);font-size:14px;margin-bottom:18px}
.field{margin-bottom:18px}
.field label{display:block;font-weight:700;font-size:15px;margin-bottom:8px}
.stepper{display:flex;align-items:center;gap:0;border:1.5px solid var(--line);border-radius:11px;overflow:hidden;width:fit-content}
.stepper button{
  width:52px;height:50px;border:none;background:#FBFAF7;font-size:24px;cursor:pointer;color:var(--ink);font-weight:600
}
.stepper input{
  width:84px;height:50px;border:none;text-align:center;font-size:19px;font-family:'Rubik';font-weight:600;outline:none
}
.opts{display:flex;flex-wrap:wrap;gap:8px}
.opt{
  border:1.5px solid var(--line);border-radius:999px;padding:10px 18px;background:#FBFAF7;
  font-family:'Assistant';font-size:15px;cursor:pointer;font-weight:600;color:var(--ink)
}
.opt.sel{background:var(--ink);color:#fff;border-color:var(--ink)}
.toggle-row{display:flex;align-items:center;justify-content:space-between;border:1.5px solid var(--line);border-radius:11px;padding:12px 16px;margin-bottom:10px;background:#FBFAF7}
.toggle-row .tname{font-weight:600;font-size:15.5px}
.switch{width:52px;height:30px;border-radius:99px;background:var(--line);position:relative;cursor:pointer;border:none;transition:background .15s}
.switch::after{content:'';position:absolute;top:3px;right:3px;width:24px;height:24px;border-radius:50%;background:#fff;transition:transform .15s;box-shadow:0 1px 3px rgba(0,0,0,.2)}
.switch.on{background:var(--green)}
.switch.on::after{transform:translateX(-22px)}
textarea.notes{
  width:100%;border:1.5px solid var(--line);border-radius:11px;padding:12px 14px;
  font-family:'Assistant';font-size:15.5px;min-height:74px;resize:vertical;outline:none;background:#FBFAF7
}
textarea.notes:focus{border-color:var(--amber)}
.sheet-actions{display:flex;gap:10px;margin-top:6px}
.btn{
  border:none;border-radius:12px;padding:15px 22px;font-family:'Rubik';font-weight:700;
  font-size:16.5px;cursor:pointer;
}
.btn-primary{background:var(--amber);color:var(--ink);flex:1}
.btn-primary:active{background:var(--amber-deep);color:#fff}
.btn-ghost{background:none;border:1.5px solid var(--line);color:var(--ink-soft)}
.btn-danger{background:none;border:1.5px solid #E3C4BB;color:var(--red)}
.btn-whatsapp{background:#25D366;color:#fff;flex:1}
.btn-whatsapp:active{background:#1DA851}
.quote-actions{display:flex;gap:10px;margin-top:20px}

/* ===== Order view ===== */
.order-empty{
  text-align:center;padding:70px 20px;color:var(--ink-soft);
}
.order-empty .big{font-size:44px;margin-bottom:12px}
.block-card{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:16px 18px;margin-bottom:12px;
}
.bc-top{display:flex;justify-content:space-between;align-items:flex-start;gap:10px}
.bc-title{font-family:'Rubik';font-weight:700;font-size:17.5px}
.bc-cat{font-size:13px;color:var(--ink-soft);margin-top:1px}
.bc-actions{display:flex;gap:6px}
.icon-btn{
  border:1px solid var(--line);background:#FBFAF7;border-radius:9px;width:38px;height:38px;
  cursor:pointer;font-size:16px;display:flex;align-items:center;justify-content:center
}
.bc-details{margin-top:10px;display:flex;flex-wrap:wrap;gap:6px}
.bc-detail{background:var(--plaster);border-radius:8px;padding:4px 10px;font-size:13.5px;color:var(--ink)}
.bc-note{margin-top:8px;font-size:14px;color:var(--ink-soft);font-style:italic}
.bc-price-row{display:flex;align-items:center;justify-content:space-between;margin-top:14px;padding-top:12px;border-top:1px dashed var(--line)}
.bc-price-row label{font-weight:700;font-size:15px}
.price-input{
  border:1.5px solid var(--line);border-radius:10px;padding:10px 14px;width:150px;
  font-family:'Rubik';font-weight:600;font-size:18px;text-align:center;outline:none;background:#FBFAF7
}
.price-input:focus{border-color:var(--amber)}
.price-input.empty{border-color:var(--amber);background:#FDF6E9}

.totals{
  background:var(--card);border:1px solid var(--line);border-radius:var(--radius);
  padding:18px 20px;margin-top:20px;
}
.trow{display:flex;justify-content:space-between;align-items:center;padding:7px 0;font-size:16px}
.trow.muted{color:var(--ink-soft);font-size:15px}
.trow input{
  width:80px;border:1.5px solid var(--line);border-radius:8px;padding:6px 8px;text-align:center;
  font-family:'Rubik';font-size:15px;outline:none
}
.trow.grand{
  border-top:2px solid var(--ink);margin-top:8px;padding-top:14px;
  font-family:'Rubik';font-weight:800;font-size:22px
}
.gen-quote{width:100%;margin-top:16px}

/* ===== Receipt bar ===== */
.receipt{
  position:fixed;bottom:0;left:0;right:0;z-index:50;
  background:var(--ink);color:#F5F2EA;padding:14px 20px;
  display:flex;align-items:center;justify-content:space-between;gap:14px;
  box-shadow:0 -6px 24px rgba(0,0,0,.18);
}
.receipt .r-info{font-size:14.5px;color:rgba(245,242,234,.75)}
.receipt .r-total{font-family:'Rubik';font-weight:800;font-size:22px;color:var(--amber)}
.receipt .r-btn{
  background:var(--amber);color:var(--ink);border:none;border-radius:11px;
  padding:12px 22px;font-family:'Rubik';font-weight:700;font-size:15.5px;cursor:pointer
}

/* ===== Quote view ===== */
.quote-paper{
  background:#fff;border:1px solid var(--line);border-radius:6px;padding:36px 34px;
  box-shadow:0 2px 14px rgba(0,0,0,.06);
}
.qp-head{display:flex;justify-content:space-between;align-items:flex-start;border-bottom:3px solid var(--ink);padding-bottom:16px;margin-bottom:12px}
.qp-head h2{font-size:26px;font-weight:800}
.qp-meta{font-size:14px;color:var(--ink-soft);text-align:left;line-height:1.6}
.quote-title{text-align:center;font-family:'Rubik';font-size:24px;font-weight:800;margin:0 0 16px}
.qp-client{margin:14px 0 4px;font-size:15.5px;line-height:1.6}
.qp-gnotes{font-size:14px;color:var(--ink-soft);margin-bottom:14px}
table.qp{width:100%;border-collapse:collapse;margin-top:10px}
table.qp th{
  text-align:right;font-family:'Rubik';font-size:13.5px;color:var(--ink-soft);
  border-bottom:1.5px solid var(--line);padding:8px 6px;font-weight:600
}
table.qp td{padding:12px 6px;border-bottom:1px solid #EEEBE3;font-size:15px;vertical-align:top}
table.qp td.p{font-family:'Rubik';font-weight:600;white-space:nowrap;text-align:left}
.qp-sub{font-size:13.5px;color:var(--ink-soft);margin-top:3px;line-height:1.45}
.qp-totals{margin-top:16px;margin-inline-start:auto;width:280px}
.qp-totals .trow.grand{font-size:20px}
.qp-foot{margin-top:26px;font-size:13px;color:var(--ink-soft);line-height:1.7;border-top:1px dashed var(--line);padding-top:14px}
.qp-foot-emphasis{display:block;margin-top:6px;font-weight:800;color:var(--ink)}
.back-link{background:none;border:none;color:var(--amber-deep);font-family:'Rubik';font-weight:700;font-size:15px;cursor:pointer;margin-bottom:14px;padding:0}
.biz-input{
  border:none;background:none;font-family:'Rubik';outline:none;text-align:right;width:100%;
  border-bottom:1px dashed transparent;
}
.biz-input:hover,.biz-input:focus{border-bottom-color:var(--amber)}
.biz-input.name{font-size:26px;font-weight:800;color:var(--ink)}
.biz-input.sub{font-family:'Assistant';font-size:14px;color:var(--ink-soft);font-weight:400}

/* ===== Business logo ===== */
.qp-brand-row{display:flex;align-items:flex-start;gap:18px;flex:1;min-width:0}
/* multiply blends the logo's white background into the paper */
.qp-logo{width:190px;max-width:45vw;height:auto;display:block;mix-blend-mode:multiply}

@media print{
  header,.tabs,.receipt,.back-link,.no-print,.sheet,.overlay,#menuView,#orderView{display:none!important}
  html,body{height:auto;background:#fff}
  main{padding:0;max-width:none}
  .quote-paper{border:none;box-shadow:none;padding:0}
  .biz-input{border-bottom-color:transparent!important}
  .biz-input:placeholder-shown{display:none!important}
}

</style>
</head>
<body>

<header id="appHeader">
  <div class="hd-top">
    <div class="brand">פנקס<span>.</span> <span style="font-size:13px;font-weight:400;color:rgba(245,242,234,.6)">הצעת מחיר בשטח</span></div>
    <div style="font-size:13px;color:rgba(245,242,234,.6)" id="dateLabel"></div>
  </div>
  <div class="proj-line">
    <input class="proj-input client" id="clientName" placeholder="שם הלקוח">
    <input class="proj-input addr" id="clientAddr" placeholder="כתובת הנכס">  </div>
  <div class="chips" id="chipsWrap">
    <button class="chip-add" onclick="addGeneralNote()">+ הערה כללית</button>
  </div>
</header>

<div class="tabs">
  <button class="tab active" id="tabMenu" onclick="switchView('menu')">תפריט עבודות</button>
  <button class="tab" id="tabOrder" onclick="switchView('order')">ההזמנה <span class="badge" id="orderBadge" style="display:none">0</span></button>
</div>

<main>
  <div id="menuView"></div>
  <div id="orderView" style="display:none"></div>
  <div id="quoteView" style="display:none"></div>
</main>

<div class="receipt" id="receiptBar">
  <div>
    <div class="r-info" id="rInfo">אין עבודות עדיין</div>
    <div class="r-total" id="rTotal">₪0</div>
  </div>
  <button class="r-btn" id="rBtn" onclick="switchView('order')">לסיכום ותמחור ←</button>
</div>

<div class="overlay" id="overlay" onclick="closeSheet()"></div>
<div class="sheet" id="sheet"><div class="sheet-grip"></div><div class="sheet-body" id="sheetBody"></div></div>

<script>
/* ================= DATA: ספריית עבודות ================= */
const LIBRARY = [
  { id:'bath', icon:'🚿', name:'מקלחת ואמבטיה', jobs:[
    { id:'bath-full', name:'שיפוץ מקלחת קומפלט', desc:'הריסה, איטום, ריצוף, חיפוי ואינסטלציה', fields:[
      {k:'size', t:'num', label:'גודל החדר (מ״ר)', def:4, step:0.5, unit:'מ״ר'},
      {k:'tile', t:'sel', label:'סוג ריצוף וחיפוי', opts:['קרמיקה סטנדרט','פורצלן','גרניט פורצלן גדול','אבן טבעית']},
      {k:'plumb', t:'tog', label:'החלפת אינסטלציה מלאה'},
      {k:'niagara', t:'tog', label:'ניאגרה סמויה'},
      {k:'shower', t:'sel', label:'פתרון רחצה', opts:['מקלחון','אמבטיה','הליכה חופשית (Walk-in)']},
    ]},
    { id:'bath-refresh', name:'רענון חדר רחצה', desc:'החלפת כלים סניטריים וברזים ללא הריסה', fields:[
      {k:'items', t:'sel', label:'היקף', opts:['כיור וברז','אסלה + כיור','קומפלט כלים']},
      {k:'silicone', t:'tog', label:'חידוש סיליקון ורובה'},
    ]},
  ]},
  { id:'paint', icon:'🎨', name:'צבע ושפכטל', jobs:[
    { id:'paint-apt', name:'צביעת דירה', desc:'קירות ותקרות, כולל תיקוני שפכטל לפי מצב', fields:[
      {k:'rooms', t:'num', label:'מספר חדרים', def:4, step:1, unit:'חדרים'},
      {k:'cond', t:'sel', label:'מצב הקירות', opts:['טוב — צבע בלבד','בינוני — תיקוני שפכטל','דורש שפכטל מלא','עובש / רטיבות']},
      {k:'type', t:'sel', label:'סוג צבע', opts:['סופרקריל','אקרילי רחיץ','צבע נגד עובש']},
      {k:'ceil', t:'tog', label:'כולל תקרות'},
      {k:'occupied', t:'tog', label:'דירה מאוכלסת (כיסוי ריהוט)'},
    ]},
    { id:'paint-room', name:'צביעת חדר בודד', desc:'חדר אחד כולל תקרה', fields:[

      {k:'color', t:'tog', label:'צבע בגוון (לא לבן)'},
    ]},
  ]},
  { id:'floor', icon:'🧱', name:'ריצוף וחיפוי', jobs:[
    { id:'floor-new', name:'ריצוף חדש', desc:'פירוק קיים או הדבקה על ריצוף קיים', fields:[
      {k:'size', t:'num', label:'שטח (מ״ר)', def:50, step:5, unit:'מ״ר'},
      {k:'method', t:'sel', label:'שיטה', opts:['פירוק ריצוף קיים','הדבקה על קיים','מילוי חול (בנייה חדשה)']},
      {k:'tile', t:'sel', label:'סוג אריח', opts:['60/60','80/80','120/60','פרקט למינציה','פרקט עץ']},
      {k:'skirt', t:'tog', label:'כולל פנלים'},
    ]},
    { id:'floor-kitchen', name:'חיפוי מטבח', desc:'קיר אחורי בין שיש לארונות', fields:[
      {k:'len', t:'num', label:'אורך (מטר רץ)', def:3, step:0.5, unit:'מ׳'},
      {k:'mat', t:'sel', label:'חומר', opts:['קרמיקה','זכוכית','אבן קיסר']},
    ]},
  ]},
  { id:'gypsum', icon:'📐', name:'גבס ותקרות', jobs:[
    { id:'gyp-ceiling', name:'תקרת גבס / תקרה צפה', desc:'כולל הכנה לתאורה שקועה', fields:[
      {k:'size', t:'num', label:'שטח (מ״ר)', def:15, step:1, unit:'מ״ר'},
      {k:'style', t:'sel', label:'סוג', opts:['ישרה','צפה עם תאורה נסתרת','מדורגת']},
      {k:'spots', t:'num', label:'נקודות ספוט', def:6, step:1, unit:'יח׳'},
    ]},

      {k:'acoustic', t:'tog', label:'בידוד אקוסטי'},
      {k:'door', t:'tog', label:'כולל פתח לדלת'},
    ]},
  ]},
  { id:'plumbing', icon:'🔧', name:'אינסטלציה', jobs:[
    { id:'plumb-points', name:'נקודות מים וביוב', desc:'הזזה או הוספה של נקודות', fields:[
      {k:'points', t:'num', label:'מספר נקודות', def:2, step:1, unit:'נק׳'},
      {k:'breaking', t:'tog', label:'דורש חציבה בקיר'},
    ]},
    { id:'plumb-boiler', name:'החלפת דוד / מערכת', desc:'דוד שמש, חשמל או מעבר לגז', fields:[
      {k:'type', t:'sel', label:'סוג', opts:['דוד שמש','דוד חשמל','מים חמים בגז']},
    ]},
  ]},

let sheetCtx = null; // {cat, job, values, notes, editUid}

function openJob(catId, jobId, editUid=null){
  const cat = LIBRARY.find(c=>c.id===catId);
  const job = cat.jobs.find(j=>j.id===jobId);
  let values = {}, notes = '';
  if(editUid){
    const b = state.blocks.find(b=>b.uid===editUid);
    values = {...b.values}; notes = b.notes;
  } else {
    job.fields.forEach(f=>{
      if(f.t==='num') values[f.k]=f.def;
      if(f.t==='sel') values[f.k]=f.opts[0];
      if(f.t==='tog') values[f.k]=false;
    });
  }
  sheetCtx = {cat, job, values, notes, editUid};
  renderSheet();
  document.getElementById('overlay').classList.add('show');
  document.getElementById('sheet').classList.add('show');
}

function renderSheet(){
  const {cat, job, values, notes, editUid} = sheetCtx;
  let html = `<h3>${job.name}</h3><div class="sub">${cat.name} · ${job.desc}</div>`;
  job.fields.forEach(f=>{
    if(f.t==='num'){
      html += `<div class="field"><label>${f.label}</label>
        <div class="stepper">
          <button onclick="stepNum('${f.k}',${-f.step})">−</button>
          <input id="num-${f.k}" value="${values[f.k]}" inputmode="decimal" onchange="setNum('${f.k}',this.value)">
          <button onclick="stepNum('${f.k}',${f.step})">+</button>
        </div></div>`;
    }
    if(f.t==='sel'){
      html += `<div class="field"><label>${f.label}</label><div class="opts">
        ${f.opts.map(o=>`<button class="opt ${values[f.k]===o?'sel':''}" onclick="setSel('${f.k}','${o.replace(/'/g,"\\'")}')">${o}</button>`).join('')}
      </div></div>`;
    }
    if(f.t==='tog'){
      html += `<div class="toggle-row"><span class="tname">${f.label}</span>
        <button class="switch ${values[f.k]?'on':''}" onclick="setTog('${f.k}')"></button></div>`;
    }
  });
  html += `<div class="field" style="margin-top:16px"><label>הערות לעבודה הזו</label>
    <textarea class="notes" id="jobNotes" placeholder="למשל: הלקוח מספק את האריחים, גישה צרה לחדר...">${esc(notes)}</textarea></div>`;
  html += `<div class="sheet-actions">
    <button class="btn btn-primary" onclick="saveBlock()">${editUid?'שמור שינויים':'הוסף להזמנה'}</button>
    ${editUid?`<button class="btn btn-danger" onclick="deleteBlock('${editUid}');closeSheet()">מחק</button>`:''}
    <button class="btn btn-ghost" onclick="closeSheet()">ביטול</button>
  </div>`;
  document.getElementById('sheetBody').innerHTML = html;
}
function stepNum(k,d){
  let v = parseFloat(sheetCtx.values[k])||0; v = Math.max(0, Math.round((v+d)*100)/100);
  sheetCtx.values[k]=v; sheetCtx.notes = document.getElementById('jobNotes').value; renderSheet();
}
function setNum(k,v){ sheetCtx.values[k]=Math.max(0,parseFloat(v)||0); }
function setSel(k,v){ sheetCtx.values[k]=v; sheetCtx.notes = document.getElementById('jobNotes').value; renderSheet(); }
function setTog(k){ sheetCtx.values[k]=!sheetCtx.values[k]; sheetCtx.notes = document.getElementById('jobNotes').value; renderSheet(); }

function saveBlock(){
  sheetCtx.notes = document.getElementById('jobNotes').value.trim();
  const numInput = document.querySelectorAll('#sheetBody .stepper input');
  numInput.forEach(inp=>{ const k = inp.id.replace('num-',''); sheetCtx.values[k]=Math.max(0,parseFloat(inp.value)||0); });
  if(sheetCtx.editUid){
    const b = state.blocks.find(b=>b.uid===sheetCtx.editUid);
    b.values = {...sheetCtx.values}; b.notes = sheetCtx.notes;
  } else {
    state.blocks.push({
      uid:'b'+(uidCounter++), catId:sheetCtx.cat.id, catName:sheetCtx.cat.name,
      jobId:sheetCtx.job.id, jobName:sheetCtx.job.name,
      values:{...sheetCtx.values}, notes:sheetCtx.notes, price:null,
    });
  }
  closeSheet(); refresh();
}
function closeSheet(){
  document.getElementById('overlay').classList.remove('show');
  document.getElementById('sheet').classList.remove('show');
}

function blockDetails(b){
  const job = LIBRARY.find(c=>c.id===b.catId).jobs.find(j=>j.id===b.jobId);

  job.fields.forEach(f=>{
    const v = b.values[f.k];
    if(f.t==='num') out.push(`${v} ${f.unit||''}`.trim()+` ${f.label.split('(')[0].trim()}`.replace(/\s+/g,' '));
    if(f.t==='sel') out.push(v);
    if(f.t==='tog' && v) out.push(f.label);

}

/* ================= PDF ================= */
// html-to-image lets the browser itself lay out the Hebrew (html2canvas drops the spaces in RTL text)
const PDF_LIBS = [
  'https://cdn.jsdelivr.net/npm/html-to-image@1.11.11/dist/html-to-image.js',
  'https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js',
];
const PDF_WIDTH_PX = 760;   // quote is laid out at this width regardless of screen size
let pdfLibPromise = null;
let fontCssPromise = null;
let pdfVersion = 0;     // bumped by renderQuote whenever the quote changes
let pdfCache = null;    // {v, file}
let pdfBuilding = null; // {v, p}

function loadScript(src){
  return new Promise((res,rej)=>{
    const s = document.createElement('script');
    s.src = src; s.onload = res;
    s.onerror = ()=>{ s.remove(); rej(new Error('failed to load '+src)); };
    document.head.appendChild(s);
  });
}
function loadPdfLibs(){
  if(window.htmlToImage && window.jspdf) return Promise.resolve();
  if(!pdfLibPromise) pdfLibPromise = Promise.all(PDF_LIBS.map(loadScript)).catch(e=>{ pdfLibPromise = null; throw e; });
  return pdfLibPromise;
}
// Google Fonts CSS can't be read cross-origin by html-to-image, so inline the Hebrew + Latin font files ourselves
function fontEmbedCss(){
  if(!fontCssPromise){
    const link = document.querySelector('link[href*="fonts.googleapis"]');
    fontCssPromise = fetch(link.href).then(r=>r.text()).then(css=>Promise.all(
      css.split(/(?=\/\* )/).filter(b=>/^\/\* (hebrew|latin) \*\//.test(b)).map(async b=>{
        const m = b.match(/url\((https:[^)]+)\)/);
        if(!m) return b;
        const blob = await fetch(m[1]).then(r=>r.blob());
        const data = await new Promise(res=>{ const fr = new FileReader(); fr.onload = ()=>res(fr.result); fr.readAsDataURL(blob); });
        return b.replace(m[1], data);
      })
    )).then(parts=>parts.join('\n')).catch(()=>{ fontCssPromise = null; return ''; });
  }
  return fontCssPromise;
}
function pdfFileName(){
  const client = document.getElementById('clientName').value.trim().replace(/[\\/:*?"<>|]/g,'');
  return `הצעת מחיר${client?' '+client:''}.pdf`;
}
async function renderPdf(name){
  await loadPdfLibs();
  const fontCss = await fontEmbedCss();
  // off-screen copy at a fixed A4-like width, cleaned up the same way the print stylesheet does
  const holder = document.createElement('div');
  holder.style.cssText = `position:fixed;left:-10000px;top:0;width:${PDF_WIDTH_PX}px`;
  const paper = document.querySelector('.quote-paper').cloneNode(true);
  paper.querySelectorAll('.no-print').forEach(n=>n.remove());
  paper.querySelectorAll('.biz-input').forEach(n=>{ if(!n.value) n.remove(); else n.style.borderBottomColor = 'transparent'; });
  paper.style.cssText = 'border:none;box-shadow:none;border-radius:0;margin:0';
  holder.appendChild(paper);
  document.body.appendChild(holder);
  try{
    const H = paper.offsetHeight;
    const margin = 10, w = 210 - 2*margin, pageH = 297 - 2*margin;
    const pagePx = pageH * PDF_WIDTH_PX / w;   // CSS px that fit on one page
    // page breaks only between rows/sections, never through a line of text
    const top0 = paper.getBoundingClientRect().top;
    const breaks = [...paper.querySelectorAll('.quote-title, .qp-head, .qp-client, tr, .qp-totals, .qp-foot')]
      .map(el=>el.getBoundingClientRect().bottom - top0).sort((a,b)=>a-b);
    const slices = [];
    for(let start = 0; start < H - 1; ){
      let end = H;
      if(start + pagePx < H){
        const fit = breaks.filter(b => b > start + 1 && b <= start + pagePx);
        end = fit.length ? fit[fit.length-1] : start + pagePx;
      }
      slices.push([start, end]);
      start = end;
    }
    // iOS caps canvas area (~16.7M px), so long quotes render at a lower pixel ratio
    const pixelRatio = Math.min(2, Math.sqrt(16e6 / (PDF_WIDTH_PX * H)));
    const opts = {pixelRatio, backgroundColor:'#fff', fontEmbedCSS:fontCss};
    // Safari sometimes paints images only on the second pass
    if(/Safari/.test(navigator.userAgent) && !/Chrome|Chromium|Android/.test(navigator.userAgent)) await htmlToImage.toCanvas(paper, opts);
    const canvas = await htmlToImage.toCanvas(paper, opts);
    const k = canvas.width / PDF_WIDTH_PX;   // canvas px per CSS px
    const {jsPDF} = window.jspdf;
    const pdf = new jsPDF({unit:'mm', format:'a4', orientation:'portrait'});
    const pageCanvas = document.createElement('canvas');
    slices.forEach(([start, end], i)=>{
      pageCanvas.width = canvas.width;
      pageCanvas.height = Math.max(1, Math.round((end - start) * k));
      const ctx = pageCanvas.getContext('2d');
      ctx.fillStyle = '#fff'; ctx.fillRect(0, 0, pageCanvas.width, pageCanvas.height);
      ctx.drawImage(canvas, 0, Math.round(start * k), canvas.width, pageCanvas.height, 0, 0, canvas.width, pageCanvas.height);
      if(i) pdf.addPage();
      pdf.addImage(pageCanvas.toDataURL('image/jpeg', 0.92), 'JPEG', margin, margin, w, (end - start) * w / PDF_WIDTH_PX);
    });
    return new File([pdf.output('blob')], name, {type:'application/pdf'});
  }finally{
    holder.remove();
  }
}
function buildPdf(){
  const v = pdfVersion;
  if(pdfCache && pdfCache.v===v) return Promise.resolve(pdfCache.file);
  if(pdfBuilding && pdfBuilding.v===v) return pdfBuilding.p;
  const p = renderPdf(pdfFileName()).then(file=>{
    if(v===pdfVersion) pdfCache = {v, file};
    return file;
  });
  pdfBuilding = {v, p};
  p.catch(()=>{ if(pdfBuilding && pdfBuilding.p===p) pdfBuilding = null; });
  return p;
}

/* Share sheet with the PDF -> pick WhatsApp -> pick contact.
   Browsers without file sharing: download the PDF and open WhatsApp to attach it. */
async function sendWhatsApp(btn){
  const LABEL = 'שלח בוואטסאפ';
  const canShareFiles = !!(navigator.canShare &&
    navigator.canShare({files:[new File([''],'x.pdf',{type:'application/pdf'})]}));
  // open the chat window now, while we still have the click (popup blockers)
  const chat = canShareFiles ? null : window.open(waUrl('שלום, מצורפת הצעת המחיר.'),'_blank');
  btn.disabled = true; btn.textContent = 'מכין PDF…';
  try{
    const file = await buildPdf();
    if(canShareFiles){
      try{
        await navigator.share({files:[file], title:file.name});
      }catch(e){
        if(e.name==='NotAllowedError'){
          // building took too long and the browser dropped the tap; the PDF is cached so the next tap shares instantly
          btn.disabled = false; btn.textContent = '📎 ה-PDF מוכן – לחץ לשליחה';
          return;
        }
        // AbortError: share sheet closed without sending
      }
    }else{
      const a = document.createElement('a');
      a.href = URL.createObjectURL(file); a.download = file.name;
      document.body.appendChild(a); a.click(); a.remove();
      setTimeout(()=>URL.revokeObjectURL(a.href), 10000);
      alert('קובץ ה-PDF ירד למחשב – צרף אותו בצ׳אט הוואטסאפ שנפתח.');
    }
  }catch(e){
    // no PDF (e.g. offline) -> send the quote as text instead
    if(chat) chat.location = waUrl(quoteText());
    else window.open(waUrl(quoteText()),'_blank');
  }
  btn.disabled = false; btn.textContent = LABEL;
}

/* ================= NAV & REFRESH ================= */
function switchView(v){
  state.view = v;
  document.getElementById('menuView').style.display = v==='menu'?'block':'none';
  document.getElementById('orderView').style.display = v==='order'?'block':'none';
  document.getElementById('quoteView').style.display = v==='quote'?'block':'none';
  document.getElementById('tabMenu').classList.toggle('active', v==='menu');
  document.getElementById('tabOrder').classList.toggle('active', v!=='menu');
  document.getElementById('receiptBar').style.display = v==='quote'?'none':'flex';
  document.getElementById('appHeader').style.display = v==='quote'?'none':'block';
  document.querySelector('.tabs').style.display = v==='quote'?'none':'flex';
  refresh();
  window.scrollTo(0,0);
}
function refresh(){
  renderOrder();
  const n = state.blocks.length;
  const priced = state.blocks.filter(b=>b.price!=null).length;
  document.getElementById('orderBadge').style.display = n?'inline':'none';
  document.getElementById('orderBadge').textContent = n;
  document.getElementById('rInfo').textContent = n===0 ? 'אין עבודות עדיין'
    : `${n} עבודות · ${priced<n ? (n-priced)+' ממתינות לתמחור' : 'הכל מתומחר ✓'}`;
  document.getElementById('rTotal').textContent = fmt(subTotal()*(1-state.discount/100)*(1+state.vat/100));
  if(state.view==='quote') renderQuote();
}

renderMenu();
refresh();
</script>
